# This file is kept in sync with .github/workflows/build.yml for convenience.
# GitHub Actions runs workflows from: .github/workflows/build.yml

name: Build Android APK (احتساب ناصبیت)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Choose build variant'
        required: true
        default: 'all_apk'
        type: choice
        options:
          - all_apk
          - debug_only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟩 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ Set up Java 17 LTS (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📜 Accept Android SDK Licenses & Prepare Environment
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-googletv-license"
          echo "33b6a2b6492d368297b41e97d19024f2b1d3d63e" >> "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo "d975f751698a77b662f1254ddbeed3901e1a16db" >> "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          echo "601085b94cd77f6b54b86eebd7773a237e2ee46f" >> "$ANDROID_HOME/licenses/google-gdk-license"

          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: 📦 Check Node Version & Install npm dependencies
        run: |
          node -v
          npm -v
          npm install --legacy-peer-deps --no-audit

      - name: 🏗️ Build Web Assets (Vite)
        run: |
          npm run build

      - name: 🔄 Sync Capacitor Android
        run: |
          ./node_modules/.
